name: Hostinger'a Otomatik Yükle

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      # NOT: FTP hesabı zaten public_html içine kök olarak bağlanıyor,
      # bu yüzden yol "public_html/" olmadan, doğrudan klasör adıyla verilir.

      # butcetakip klasörüne yükle (subdomain'in okuduğu klasör)
      - name: FTP - butcetakip
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          server-dir: butcetakip/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
            icons/gen-icons.js

      # butce klasörüne de yükle (subdomain oraya bağlıysa da güncel olsun)
      - name: FTP - butce
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          server-dir: butce/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
            icons/gen-icons.js
