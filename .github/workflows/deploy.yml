name: Hostinger'a Otomatik Yükle

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      # FTP hesabı public_html'e kilitli. Buraya (butce/) yazıp nereye
      # düştüğünü işaretli dosyayla test ediyoruz.
      - name: FTP ile Hostinger'a yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          server-dir: butce/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
            icons/gen-icons.js
