name: Altın fiyatları (altinkaynak)

on:
  schedule:
    - cron: "0 7,15 * * *"   # ~10:00 ve 18:00 (TR) civarı
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fiyatları çek
        run: node scripts/fetch-gold.js
      - name: Fiyat geçmişini güncelle
        run: node scripts/fetch-history.js
      - name: Değiştiyse commit + push
        run: |
          if ! git diff --quiet -- gold-prices.json gold-history.json; then
            git config user.name "gold-bot"
            git config user.email "actions@users.noreply.github.com"
            git add gold-prices.json gold-history.json
            git commit -m "Altın fiyatları güncellendi (altinkaynak)"
            git push
          else
            echo "Değişiklik yok"
          fi
